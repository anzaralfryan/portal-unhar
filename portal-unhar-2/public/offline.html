<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F9E7B" />
    <title>Offline — Portal UNHAR</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #f3fdf9, #e8f5ef);
        color: #1a3d33;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 158, 123, 0.12);
      }
      .icon {
        font-size: 56px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        color: #0F9E7B;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.6;
        color: #4b6b5f;
      }
      button {
        background: #0F9E7B;
        color: #fff;
        border: none;
        padding: 12px 28px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #0a7a5e; }
      .hint {
        margin-top: 20px;
        font-size: 12px;
        color: #8ba198;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Kamu Sedang Offline</h1>
      <p>Koneksi internet terputus. Beberapa halaman yang sudah pernah dibuka mungkin masih bisa diakses dari cache.</p>
      <button onclick="location.reload()">Coba Lagi</button>
      <p class="hint">Portal Universitas Harapan Medan</p>
    </div>
  </body>
</html>
